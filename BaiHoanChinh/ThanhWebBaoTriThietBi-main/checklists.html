<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Checklist - Hệ thống Bảo trì</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">

  <style>
    /* ===== STYLE SIDEBAR CHUẨN ===== */
    .nav-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 500;
      color: #374151;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .nav-link:hover {
      background-color: #f3f4f6;
      color: #2563eb;
    }
    .nav-link.active {
      background-color: #e0f2fe;
      color: #2563eb;
      font-weight: 600;
      box-shadow: inset 2px 0 0 0 #2563eb;
    }

    /* ===== MODAL CHUẨN ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 50;
    }
    .modal.show {
      display: flex;
    }
  </style>
</head>

<body class="bg-gray-50">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
      <div class="p-6 border-b border-gray-200">
        <h1 class="text-2xl font-bold text-blue-600">Hệ thống Bảo trì</h1>
      </div>

      <nav class="flex-1 p-4 overflow-y-auto space-y-1">
        <a href="dashboard.html" class="nav-link">📊 Tổng quan</a>
        <a href="assets.html" class="nav-link">🏢 Tài sản</a>
        <a href="customers.html" class="nav-link">👥 Khách hàng</a>
        <a href="warranties.html" class="nav-link">🛡️ Bảo hành</a>
        <a href="work-orders.html" class="nav-link">📋 Phiếu công việc</a>
        <a href="schedules.html" class="nav-link">📅 Lịch bảo trì</a>
        <a href="incidents.html" class="nav-link">⚠️ Sự cố</a>
        <a href="inventory.html" class="nav-link">🔧 Kho linh kiện</a>
        <a href="warehouse.html" class="nav-link">📦 Phiếu kho</a>
        <a href="employees.html" class="nav-link">👨‍💼 Nhân viên</a>
        <a href="roles.html" class="nav-link">🔐 Phân quyền</a>
        <a href="checklists.html" class="nav-link active">✅ Checklist</a>
        <a href="logs.html" class="nav-link">📝 Nhật ký</a>
      </nav>

      <div class="p-4 border-t border-gray-200">
        <button onclick="logout()" class="w-full bg-red-500 text-white py-2 rounded hover:bg-red-600">
          Đăng xuất
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto">
      <div class="p-8">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-3xl font-bold text-gray-800">Quản lý Checklist</h2>
          <button onclick="openModal()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">+ Thêm checklist</button>
        </div>

        <!-- Checklists Grid -->
        <div id="checklistsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Dữ liệu checklist sẽ được load ở đây -->
        </div>
      </div>
    </main>
  </div>

  <!-- Add Modal -->
  <div id="checklistModal" class="modal">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md mx-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-xl font-bold">Thêm checklist mới</h3>
        <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
      </div>

      <form id="checklistForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tên checklist *</label>
          <input type="text" id="name" required class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
          <textarea id="description" rows="3" class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <div class="flex gap-3 pt-4">
          <button type="button" onclick="closeModal()" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400">Hủy</button>
          <button type="submit" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ===== MODAL LOGIC =====
    const modal = document.getElementById('checklistModal');
    function openModal() { modal.classList.add('show'); }
    function closeModal() { modal.classList.remove('show'); }

    window.onclick = function(e) {
      if (e.target === modal) closeModal();
    };
  </script>

  <script src="checklists.js"></script>
</body>
</html>
